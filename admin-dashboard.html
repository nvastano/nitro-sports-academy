<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Nitro Sports Academy Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#2B4FA8;--blue-dark:#1a3278;--blue-light:#3d65cc;--gold:#E8B84B;--silver:#9AA0B4;--silver-light:#C8CDD9;--dark:#0D1321;--dark-mid:#1C2540;--white:#fff}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
  /* Header */
  header{background:rgba(13,19,33,0.97);border-bottom:2px solid var(--blue);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
  .logo img{height:44px}
  .logo-text{font-family:'Oswald',sans-serif;font-size:1rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--white)}
  .logo-text span{color:var(--blue-light)}
  nav-right{display:flex;align-items:center;gap:12px}
  .btn-logout{background:transparent;border:1px solid rgba(255,255,255,0.2);border-radius:4px;color:var(--silver);padding:8px 16px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
  .btn-logout:hover{border-color:var(--blue);color:var(--white)}
  /* Layout */
  .page{max-width:1200px;margin:0 auto;padding:32px 24px}
  h1{font-family:'Oswald',sans-serif;font-size:1.8rem;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:24px}
  /* Stats row */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:32px}
  .stat{background:var(--dark-mid);border:1px solid rgba(43,79,168,0.3);border-radius:8px;padding:20px}
  .stat-num{font-family:'Oswald',sans-serif;font-size:2rem;font-weight:700;color:var(--blue-light)}
  .stat-label{font-size:0.8rem;color:var(--silver);text-transform:uppercase;letter-spacing:0.08em;margin-top:4px}
  /* Renewals panel */
  .renewals{background:var(--dark-mid);border:1px solid rgba(232,184,75,0.3);border-radius:8px;padding:24px;margin-bottom:32px}
  .renewals h2{font-family:'Oswald',sans-serif;font-size:1rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .renewal-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);flex-wrap:wrap;gap:8px}
  .renewal-row:last-child{border-bottom:none}
  .renewal-name{font-weight:600;cursor:pointer;color:var(--white)}
  .renewal-name:hover{color:var(--blue-light)}
  .renewal-meta{font-size:0.85rem;color:var(--silver);margin-top:2px}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase}
  .badge-active{background:rgba(43,168,79,0.2);color:#4caf6e;border:1px solid rgba(43,168,79,0.3)}
  .badge-expired{background:rgba(220,50,50,0.2);color:#ff7b7b;border:1px solid rgba(220,50,50,0.3)}
  .badge-pending{background:rgba(232,184,75,0.2);color:var(--gold);border:1px solid rgba(232,184,75,0.3)}
  .due-amount{font-family:'Oswald',sans-serif;font-size:1rem;color:var(--gold)}
  /* Toolbar */
  .toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .search-wrap{flex:1;min-width:200px;position:relative}
  .search-wrap input{width:100%;background:var(--dark-mid);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:10px 16px 10px 40px;color:var(--white);font-family:'Barlow',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s}
  .search-wrap input:focus{border-color:var(--blue-light)}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--silver);font-size:1rem}
  select{background:var(--dark-mid);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:10px 16px;color:var(--white);font-family:'Barlow',sans-serif;font-size:0.95rem;outline:none}
  .btn-add{background:var(--blue);border:none;border-radius:6px;padding:10px 20px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.9rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--white);cursor:pointer;transition:background 0.2s;white-space:nowrap}
  .btn-add:hover{background:var(--blue-light)}
  /* Table */
  .table-wrap{overflow-x:auto;border-radius:8px;border:1px solid rgba(255,255,255,0.07)}
  table{width:100%;border-collapse:collapse;font-size:0.9rem}
  thead{background:var(--dark-mid)}
  th{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--silver);padding:12px 16px;text-align:left;white-space:nowrap}
  td{padding:14px 16px;border-top:1px solid rgba(255,255,255,0.05);vertical-align:middle}
  tr{cursor:pointer;transition:background 0.15s}
  tr:hover td{background:rgba(43,79,168,0.1)}
  .client-name{font-weight:600;color:var(--white)}
  .client-sub{font-size:0.8rem;color:var(--silver);margin-top:2px}
  .amount-due{color:var(--gold);font-weight:600}
  .empty{text-align:center;padding:48px;color:var(--silver)}
  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;display:none}
  .modal-bg.open{display:flex}
  .modal{background:var(--dark-mid);border:1px solid rgba(43,79,168,0.4);border-radius:10px;padding:32px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
  .modal h2{font-family:'Oswald',sans-serif;font-size:1.3rem;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:24px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .form-grid .full{grid-column:1/-1}
  label{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--silver);margin-bottom:5px}
  input,select.form-inp{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:10px 14px;color:var(--white);font-family:'Barlow',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s}
  input:focus,select.form-inp:focus{border-color:var(--blue-light)}
  .modal-footer{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
  .btn-cancel{background:transparent;border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:10px 20px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--silver);cursor:pointer}
  .btn-save{background:var(--blue);border:none;border-radius:6px;padding:10px 24px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--white);cursor:pointer;transition:background 0.2s}
  .btn-save:hover{background:var(--blue-light)}
  .loading{text-align:center;padding:48px;color:var(--silver)}
  @media(max-width:600px){.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:1}}
</style>
</head>
<body>

<header>
  <a class="logo" href="admin-dashboard.html">
    <img src="images/nitro-logo.png" alt="Nitro">
    <span class="logo-text"><span>Nitro</span> Admin</span>
  </a>
  <button class="btn-logout" onclick="logout()">Sign Out</button>
</header>

<div class="page">
  <h1>Client Dashboard</h1>

  <div class="stats" id="stats">
    <div class="stat"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Total Clients</div></div>
    <div class="stat"><div class="stat-num" id="stat-active">—</div><div class="stat-label">Active Members</div></div>
    <div class="stat"><div class="stat-num" id="stat-renewals">—</div><div class="stat-label">Renewals This Month</div></div>
    <div class="stat"><div class="stat-num" id="stat-due">—</div><div class="stat-label">Balance Owed</div></div>
  </div>

  <div class="renewals" id="renewals-panel">
    <h2>⚠ Renewals Due in Next 30 Days</h2>
    <div id="renewals-list"><div class="loading">Loading…</div></div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Search by name, email, or team…" oninput="filterClients()">
    </div>
    <select id="statusFilter" onchange="filterClients()">
      <option value="">All Statuses</option>
      <option value="active">Active</option>
      <option value="expired">Expired</option>
      <option value="pending">Pending</option>
    </select>
    <button class="btn-add" onclick="openModal()">+ Add Client</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Client</th>
          <th>Membership</th>
          <th>Status</th>
          <th>Renewal Date</th>
          <th>Paid</th>
          <th>Due</th>
        </tr>
      </thead>
      <tbody id="clientTable"><tr><td colspan="6" class="loading">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<!-- Add Client Modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2>Add New Client</h2>
    <form id="addForm" onsubmit="saveClient(event)">
      <div class="form-grid">
        <div>
          <label>First Name *</label>
          <input name="first_name" required>
        </div>
        <div>
          <label>Last Name *</label>
          <input name="last_name" required>
        </div>
        <div>
          <label>Email</label>
          <input name="email" type="email">
        </div>
        <div>
          <label>Phone</label>
          <input name="phone" type="tel">
        </div>
        <div class="full">
          <label>Address</label>
          <input name="address">
        </div>
        <div>
          <label>Date of Birth</label>
          <input name="date_of_birth" type="date">
        </div>
        <div>
          <label>Years Playing</label>
          <input name="years_playing" type="number" min="0">
        </div>
        <div>
          <label>Current Team</label>
          <input name="current_team">
        </div>
        <div>
          <label>Primary Position</label>
          <input name="primary_position">
        </div>
        <div>
          <label>Secondary Position</label>
          <input name="secondary_position">
        </div>
        <div>
          <label>Emergency Contact Name</label>
          <input name="emergency_contact_name">
        </div>
        <div>
          <label>Emergency Contact Phone</label>
          <input name="emergency_contact_phone" type="tel">
        </div>
        <div class="full" style="border-top:1px solid rgba(255,255,255,0.08);padding-top:16px;margin-top:4px">
          <label style="color:var(--gold);font-size:0.85rem">Membership (optional — can add later)</label>
        </div>
        <div>
          <label>Membership Type</label>
          <select name="membership_type" class="form-inp">
            <option value="">— None —</option>
            <option value="individual">Individual ($395/yr)</option>
            <option value="family_2">Family 2 siblings ($595/yr)</option>
            <option value="family_3plus">Family 3+ siblings ($645/yr)</option>
          </select>
        </div>
        <div>
          <label>Start Date</label>
          <input name="start_date" type="date">
        </div>
        <div>
          <label>Renewal Date</label>
          <input name="renewal_date" type="date">
        </div>
        <div>
          <label>Amount Paid ($)</label>
          <input name="amount_paid" type="number" min="0" step="0.01" value="0">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-save">Save Client</button>
      </div>
    </form>
  </div>
</div>

<script>
const API = 'https://nitro-crm.nicholas-vastano.workers.dev';
let allClients = [];

function getToken() {
  const t = localStorage.getItem('nitro_token');
  if (!t) { window.location.href = 'admin.html'; return null; }
  return t;
}

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` };
}

function logout() {
  localStorage.removeItem('nitro_token');
  window.location.href = 'admin.html';
}

function membershipLabel(type) {
  return { individual: 'Individual', family_2: 'Family (2)', family_3plus: 'Family (3+)' }[type] ?? '—';
}

function badgeHtml(status) {
  const cls = { active: 'badge-active', expired: 'badge-expired', pending: 'badge-pending' }[status] ?? 'badge-pending';
  return `<span class="badge ${cls}">${status ?? 'none'}</span>`;
}

async function loadRenewals() {
  const res = await fetch(`${API}/renewals/upcoming?days=30`, { headers: authHeaders() });
  if (res.status === 401) { logout(); return; }
  const data = await res.json();
  const el = document.getElementById('renewals-list');
  document.getElementById('stat-renewals').textContent = data.length;
  if (!data.length) { el.innerHTML = '<div style="color:var(--silver);font-size:0.9rem">No renewals due in the next 30 days.</div>'; return; }
  el.innerHTML = data.map(r => `
    <div class="renewal-row" onclick="go('${r.id}')">
      <div>
        <div class="renewal-name">${r.first_name} ${r.last_name}</div>
        <div class="renewal-meta">${membershipLabel(r.type)} · ${r.email ?? ''}</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <div style="font-size:0.85rem;color:var(--silver)">Due ${r.renewal_date}</div>
        <div class="due-amount">$${(r.amount_due ?? 0).toFixed(2)}</div>
      </div>
    </div>`).join('');
}

async function loadClients() {
  const res = await fetch(`${API}/clients`, { headers: authHeaders() });
  if (res.status === 401) { logout(); return; }
  allClients = await res.json();
  updateStats();
  renderTable(allClients);
}

function updateStats() {
  document.getElementById('stat-total').textContent = allClients.length;
  document.getElementById('stat-active').textContent = allClients.filter(c => c.membership_status === 'active').length;
  const totalDue = allClients.reduce((s, c) => s + (c.amount_due ?? 0), 0);
  document.getElementById('stat-due').textContent = `$${totalDue.toFixed(0)}`;
}

function renderTable(clients) {
  const tbody = document.getElementById('clientTable');
  if (!clients.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">No clients found.</td></tr>'; return; }
  tbody.innerHTML = clients.map(c => `
    <tr onclick="go('${c.id}')">
      <td><div class="client-name">${c.first_name} ${c.last_name}</div><div class="client-sub">${c.email ?? ''}</div></td>
      <td>${membershipLabel(c.membership_type)}</td>
      <td>${badgeHtml(c.membership_status)}</td>
      <td style="color:var(--silver-light)">${c.renewal_date ?? '—'}</td>
      <td style="color:var(--silver-light)">$${(c.amount_paid ?? 0).toFixed(2)}</td>
      <td class="amount-due">$${(c.amount_due ?? 0).toFixed(2)}</td>
    </tr>`).join('');
}

function filterClients() {
  const s = document.getElementById('search').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const filtered = allClients.filter(c => {
    const match = !s || [c.first_name, c.last_name, c.email, c.current_team].some(v => (v ?? '').toLowerCase().includes(s));
    const statusMatch = !status || c.membership_status === status;
    return match && statusMatch;
  });
  renderTable(filtered);
}

function go(id) { window.location.href = `admin-client.html?id=${id}`; }

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); document.getElementById('addForm').reset(); }

async function saveClient(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  const membershipType = body.membership_type;
  const startDate = body.start_date;
  const renewalDate = body.renewal_date;
  const amountPaid = parseFloat(body.amount_paid) || 0;
  delete body.membership_type; delete body.start_date; delete body.renewal_date; delete body.amount_paid;
  if (body.years_playing) body.years_playing = parseInt(body.years_playing);

  const res = await fetch(`${API}/clients`, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) });
  if (!res.ok) { alert('Error saving client'); return; }
  const client = await res.json();

  if (membershipType) {
    const prices = { individual: 395, family_2: 595, family_3plus: 645 };
    await fetch(`${API}/clients/${client.id}/memberships`, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ type: membershipType, start_date: startDate || null, renewal_date: renewalDate || null, amount_paid: amountPaid, status: 'active' }),
    });
  }
  closeModal();
  await loadClients();
}

document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

getToken();
loadRenewals();
loadClients();
</script>
</body>
</html>
