<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client — Nitro Sports Academy Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#2B4FA8;--blue-dark:#1a3278;--blue-light:#3d65cc;--gold:#E8B84B;--silver:#9AA0B4;--silver-light:#C8CDD9;--dark:#0D1321;--dark-mid:#1C2540;--white:#fff}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
  header{background:rgba(13,19,33,0.97);border-bottom:2px solid var(--blue);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
  .logo-text{font-family:'Oswald',sans-serif;font-size:1rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--white)}
  .logo-text span{color:var(--blue-light)}
  .header-right{display:flex;align-items:center;gap:12px}
  .btn-sm{background:transparent;border:1px solid rgba(255,255,255,0.2);border-radius:4px;color:var(--silver);padding:8px 16px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:all 0.2s;display:inline-block}
  .btn-sm:hover{border-color:var(--blue);color:var(--white)}
  .page{max-width:960px;margin:0 auto;padding:32px 24px}
  .client-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px}
  .client-name-block h1{font-family:'Oswald',sans-serif;font-size:2rem;letter-spacing:0.04em;text-transform:uppercase}
  .client-name-block p{color:var(--silver);margin-top:4px;font-size:0.95rem}
  .badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase}
  .badge-active{background:rgba(43,168,79,0.2);color:#4caf6e;border:1px solid rgba(43,168,79,0.3)}
  .badge-expired{background:rgba(220,50,50,0.2);color:#ff7b7b;border:1px solid rgba(220,50,50,0.3)}
  .badge-pending{background:rgba(232,184,75,0.2);color:var(--gold);border:1px solid rgba(232,184,75,0.3)}
  .badge-household{background:rgba(43,79,168,0.2);color:var(--blue-light);border:1px solid rgba(43,79,168,0.3);cursor:pointer}
  .badge-household:hover{background:rgba(43,79,168,0.35)}
  .tabs{display:flex;gap:4px;border-bottom:2px solid rgba(255,255,255,0.08);margin-bottom:28px}
  .tab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;letter-spacing:0.1em;text-transform:uppercase;padding:10px 20px;color:var(--silver);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s}
  .tab.active{color:var(--white);border-bottom-color:var(--blue-light)}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  .card{background:var(--dark-mid);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:24px;margin-bottom:20px}
  .card-title{font-family:'Oswald',sans-serif;font-size:1rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--silver);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field-grid .full{grid-column:1/-1}
  label{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--silver);margin-bottom:5px}
  input,select{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:5px;padding:9px 13px;color:var(--white);font-family:'Barlow',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s}
  input:focus,select:focus{border-color:var(--blue-light)}
  .btn-primary{background:var(--blue);border:none;border-radius:5px;padding:10px 24px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--white);cursor:pointer;transition:background 0.2s}
  .btn-primary:hover{background:var(--blue-light)}
  .btn-gold{background:var(--gold);border:none;border-radius:5px;padding:12px 24px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.9rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--dark);cursor:pointer;transition:opacity 0.2s}
  .btn-gold:hover{opacity:0.85}
  .btn-gold:disabled{opacity:0.5;cursor:not-allowed}
  /* Membership card */
  .mem-card{background:linear-gradient(135deg,var(--blue-dark),var(--dark-mid));border:1px solid rgba(43,79,168,0.5);border-radius:10px;padding:24px;position:relative;overflow:hidden}
  .mem-card::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;background:var(--blue);opacity:0.1;border-radius:50%}
  .mem-type{font-family:'Oswald',sans-serif;font-size:1.3rem;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .mem-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.07);font-size:0.9rem}
  .mem-row:last-child{border-bottom:none}
  .mem-label{color:var(--silver)}.mem-value{font-weight:600}
  .mem-due{font-family:'Oswald',sans-serif;font-size:1.8rem;color:var(--gold);margin:16px 0 4px}
  /* Payments */
  .pay-table{width:100%;border-collapse:collapse;font-size:0.88rem}
  .pay-table th{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--silver);padding:8px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.08)}
  .pay-table td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle}
  .add-pay-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end;margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.08)}
  /* Household tab */
  .hh-banner{background:rgba(43,79,168,0.15);border:1px solid rgba(43,79,168,0.35);border-radius:8px;padding:20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .hh-banner-name{font-family:'Oswald',sans-serif;font-size:1.1rem;letter-spacing:0.04em;text-transform:uppercase}
  .hh-banner-sub{font-size:0.85rem;color:var(--silver);margin-top:4px}
  .member-list{display:flex;flex-direction:column;gap:10px}
  .member-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:6px;padding:12px 16px;cursor:pointer;transition:border-color 0.2s}
  .member-row:hover{border-color:var(--blue-light)}
  .member-name{font-weight:600}
  .member-meta{font-size:0.82rem;color:var(--silver);margin-top:3px}
  .role-pill{font-size:0.72rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 10px;border-radius:20px}
  .role-contact{background:rgba(232,184,75,0.2);color:var(--gold);border:1px solid rgba(232,184,75,0.3)}
  .role-athlete{background:rgba(43,79,168,0.2);color:var(--blue-light);border:1px solid rgba(43,79,168,0.3)}
  /* Modals */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  .modal-bg.open{display:flex}
  .modal{background:var(--dark-mid);border:1px solid rgba(43,79,168,0.4);border-radius:10px;padding:32px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
  .modal h2{font-family:'Oswald',sans-serif;font-size:1.2rem;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:20px}
  .modal-footer{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
  .btn-cancel{background:transparent;border:1px solid rgba(255,255,255,0.2);border-radius:5px;padding:9px 18px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--silver);cursor:pointer}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--dark-mid);border:1px solid rgba(43,79,168,0.5);border-radius:8px;padding:14px 20px;font-size:0.9rem;z-index:300;transform:translateY(80px);opacity:0;transition:all 0.3s}
  .toast.show{transform:translateY(0);opacity:1}
  .toast.success{border-color:rgba(43,168,79,0.5);color:#4caf6e}
  .toast.error{border-color:rgba(220,50,50,0.5);color:#ff7b7b}
  .empty{color:var(--silver);font-size:0.9rem;padding:16px 0}
  @media(max-width:600px){.field-grid{grid-template-columns:1fr}.field-grid .full{grid-column:1}}
</style>
</head>
<body>

<header>
  <a class="logo" href="admin-dashboard.html">
    <span class="logo-text"><span>Nitro</span> Sports Academy — Admin</span>
  </a>
  <div class="header-right">
    <a class="btn-sm" href="admin-dashboard.html">← Dashboard</a>
    <button class="btn-sm" onclick="logout()">Sign Out</button>
  </div>
</header>

<div class="page" id="page" style="display:none">
  <div class="client-header">
    <div class="client-name-block">
      <h1 id="clientName">Loading…</h1>
      <p id="clientSub"></p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center" id="headerBadges">
      <button class="btn-sm" style="border-color:rgba(220,50,50,0.4);color:#ff7b7b" onclick="deleteClient()">Delete Client</button>
    </div>
  </div>

  <div id="leadBar" style="display:none;background:rgba(43,79,168,0.15);border:1px solid rgba(43,79,168,0.35);border-radius:8px;padding:16px 20px;margin-bottom:20px;display:none;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
    <div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--blue-light);margin-bottom:4px">Lead Status</div>
      <div id="leadInquiryType" style="font-size:0.9rem;color:var(--silver-light)"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <select id="leadStatusSelect" onchange="updateLeadStatus()" style="background:var(--dark-mid);border:1px solid rgba(43,79,168,0.4);border-radius:5px;padding:8px 14px;color:var(--white);font-family:'Barlow',sans-serif;font-size:0.9rem;outline:none">
        <option value="lead">New Lead</option>
        <option value="contacted">Contacted</option>
        <option value="converted">Converted</option>
        <option value="closed">Closed</option>
      </select>
    </div>
  </div>
  <div id="leadNotesBar" style="display:none;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:14px 20px;margin-bottom:20px;font-size:0.9rem;color:var(--silver-light);font-style:italic"></div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('profile')">Profile</div>
    <div class="tab" onclick="switchTab('membership')">Membership</div>
    <div class="tab" onclick="switchTab('payments')">Payments</div>
    <div class="tab" onclick="switchTab('household')">Household</div>
  </div>

  <!-- PROFILE -->
  <div class="tab-panel active" id="tab-profile">
    <div class="card">
      <div class="card-title">Contact Info</div>
      <form id="profileForm" onsubmit="saveProfile(event)">
        <div class="field-grid">
          <div><label>First Name</label><input name="first_name" required></div>
          <div><label>Last Name</label><input name="last_name" required></div>
          <div><label>Email</label><input name="email" type="email"></div>
          <div><label>Phone</label><input name="phone" type="tel"></div>
          <div class="full"><label>Address</label><input name="address"></div>
          <div><label>Date of Birth</label><input name="date_of_birth" type="date"></div>
          <div><label>Years Playing</label><input name="years_playing" type="number" min="0"></div>
          <div><label>Current Team</label><input name="current_team"></div>
          <div><label>Primary Position</label><input name="primary_position"></div>
          <div><label>Secondary Position</label><input name="secondary_position"></div>
          <div><label>Emergency Contact Name</label><input name="emergency_contact_name"></div>
          <div><label>Emergency Contact Phone</label><input name="emergency_contact_phone" type="tel"></div>
          <div class="full"><button type="submit" class="btn-primary">Save Profile</button></div>
        </div>
      </form>
    </div>
  </div>

  <!-- MEMBERSHIP -->
  <div class="tab-panel" id="tab-membership">
    <div class="mem-card" id="memCard"><div class="empty">No membership on file.</div></div>
    <div style="margin-top:16px">
      <button class="btn-primary" onclick="openRenewModal()">+ Add / Renew Membership</button>
    </div>
  </div>

  <!-- PAYMENTS -->
  <div class="tab-panel" id="tab-payments">
    <div class="card">
      <div class="card-title">Payment History</div>
      <table class="pay-table">
        <thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Venmo Ref</th><th>Notes</th><th></th></tr></thead>
        <tbody id="payTable"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
      <div class="add-pay-form">
        <div><label>Amount ($)</label><input type="number" id="payAmount" min="0" step="0.01" placeholder="0.00"></div>
        <div><label>Date</label><input type="date" id="payDate"></div>
        <div><label>Venmo Reference</label><input type="text" id="payRef" placeholder="Optional"></div>
        <div><label>Notes</label><input type="text" id="payNotes" placeholder="Optional"></div>
        <div><button class="btn-primary" onclick="addPayment()" style="margin-top:20px">+ Record Payment</button></div>
      </div>
    </div>
  </div>

  <!-- HOUSEHOLD -->
  <div class="tab-panel" id="tab-household">
    <div id="householdContent"><div class="empty">Loading…</div></div>
  </div>
</div>

<!-- Membership Modal (create + edit) -->
<div class="modal-bg" id="renewModal">
  <div class="modal">
    <h2 id="renewModalTitle">Add / Renew Membership</h2>
    <div style="display:grid;gap:14px">
      <div><label>Membership Type</label>
        <select id="ren-type" onchange="updateDefaultPrice()">
          <option value="individual">Individual</option>
          <option value="family_2">Family — 2 siblings</option>
          <option value="family_3plus">Family — 3+ siblings</option>
        </select>
      </div>
      <div>
        <label>Total Price ($) <span style="color:var(--silver);font-weight:400;text-transform:none;letter-spacing:0">— override default here</span></label>
        <input type="number" id="ren-price" min="0" step="0.01" placeholder="Leave blank to use default">
      </div>
      <div><label>Start Date</label><input type="date" id="ren-start"></div>
      <div><label>Renewal Date</label><input type="date" id="ren-renewal"></div>
      <div><label>Amount Paid ($)</label><input type="number" id="ren-paid" min="0" step="0.01" value="0"></div>
      <div><label>Status</label>
        <select id="ren-status">
          <option value="active">Active</option>
          <option value="pending">Pending</option>
          <option value="expired">Expired</option>
        </select>
      </div>
      <div><label>Notes</label><input type="text" id="ren-notes" placeholder="Optional"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeRenewModal()">Cancel</button>
      <button class="btn-primary" onclick="saveMembership()">Save</button>
    </div>
  </div>
</div>

<!-- Assign Household Modal -->
<div class="modal-bg" id="hhModal">
  <div class="modal">
    <h2>Assign Household</h2>
    <div style="display:grid;gap:14px">
      <div>
        <label>Household</label>
        <select id="hhSelect"><option value="">— None (remove from household) —</option></select>
      </div>
      <div>
        <label>Role</label>
        <select id="hhRole">
          <option value="athlete">Athlete</option>
          <option value="contact">Contact / Parent</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeHHModal()">Cancel</button>
      <button class="btn-primary" onclick="saveHousehold()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://nitro-crm.nicholas-vastano.workers.dev';
const params = new URLSearchParams(location.search);
const clientId = params.get('id');
let clientData = null, currentMembership = null, allHouseholds = [];

function getToken() {
  const t = localStorage.getItem('nitro_token');
  if (!t) { window.location.href = 'admin.html'; return null; }
  return t;
}
function authHeaders() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` }; }
function logout() { localStorage.removeItem('nitro_token'); window.location.href = 'admin.html'; }

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function switchTab(name) {
  const tabs = ['profile','membership','payments','household'];
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', tabs[i] === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  if (name === 'payments') loadPayments();
  if (name === 'household') renderHouseholdTab();
}

function membershipLabel(type) {
  return { individual: 'Individual', family_2: 'Family (2 siblings)', family_3plus: 'Family (3+ siblings)' }[type] ?? '—';
}
function badgeHtml(status) {
  const cls = { active: 'badge-active', expired: 'badge-expired', pending: 'badge-pending' }[status] ?? 'badge-pending';
  return `<span class="badge ${cls}">${status ?? 'none'}</span>`;
}

function fillProfile(client) {
  const form = document.getElementById('profileForm');
  ['first_name','last_name','email','phone','address','date_of_birth','years_playing',
   'current_team','primary_position','secondary_position','emergency_contact_name','emergency_contact_phone']
    .forEach(k => { if (form[k]) form[k].value = client[k] ?? ''; });
}

function renderMembership(m) {
  currentMembership = m;
  const card = document.getElementById('memCard');
  const prices = { individual: 395, family_2: 595, family_3plus: 645 };
  if (!m) { card.innerHTML = '<div class="empty">No membership on file. Click "Add / Renew Membership" below.</div>'; return; }
  const price = prices[m.type] ?? 0;
  const isHhMembership = !!m.household_id;
  card.innerHTML = `
    <div class="mem-type">
      ${membershipLabel(m.type)}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${isHhMembership ? `<span class="badge badge-household">Household Membership</span>` : ''}
        ${badgeHtml(m.status)}
      </div>
    </div>
    <div class="mem-row"><span class="mem-label">Annual Price</span><span class="mem-value">$${price.toFixed(2)}</span></div>
    <div class="mem-row"><span class="mem-label">Start Date</span><span class="mem-value">${m.start_date ?? '—'}</span></div>
    <div class="mem-row"><span class="mem-label">Renewal Date</span><span class="mem-value">${m.renewal_date ?? '—'}</span></div>
    <div class="mem-row"><span class="mem-label">Amount Paid</span><span class="mem-value" style="color:#4caf6e">$${(m.amount_paid ?? 0).toFixed(2)}</span></div>
    <div class="mem-row"><span class="mem-label">Balance Due</span><span class="mem-value" style="color:var(--gold)">$${(m.amount_due ?? 0).toFixed(2)}</span></div>
    ${m.notes ? `<div class="mem-row"><span class="mem-label">Notes</span><span class="mem-value">${m.notes}</span></div>` : ''}
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.08)">
      <p style="color:var(--silver);font-size:0.8rem;margin-bottom:8px">BALANCE DUE</p>
      <div class="mem-due">$${(m.amount_due ?? 0).toFixed(2)}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
        <button class="btn-gold" id="invoiceBtn" onclick="sendInvoice()" ${!clientData?.email ? 'disabled title="No email on file"' : ''}>
          Send Invoice Email
        </button>
        <button class="btn-primary" onclick='openEditMembershipModal(${JSON.stringify(m)})'>Edit</button>
        <button class="btn-sm" style="border-color:rgba(220,50,50,0.4);color:#ff7b7b" onclick="deleteMembership('${m.id}')">Delete</button>
      </div>
    </div>`;
}

function renderHouseholdTab() {
  const el = document.getElementById('householdContent');
  if (!clientData) return;
  const { household, householdMembers } = clientData;

  if (!household) {
    el.innerHTML = `
      <div class="card">
        <div class="card-title">Household</div>
        <p style="color:var(--silver);margin-bottom:20px">This client is not assigned to a household.</p>
        <button class="btn-primary" onclick="openHHModal()">Assign to Household</button>
      </div>`;
    return;
  }

  const roleLabel = { contact: 'Contact / Parent', athlete: 'Athlete' };
  const roleClass = { contact: 'role-contact', athlete: 'role-athlete' };
  const thisRole = clientData.household_role ?? 'athlete';

  el.innerHTML = `
    <div class="hh-banner">
      <div>
        <div class="hh-banner-name">${household.name}</div>
        <div class="hh-banner-sub">This client's role: <strong style="color:var(--white)">${roleLabel[thisRole] ?? thisRole}</strong></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a href="admin-household.html?id=${household.id}" class="btn-sm">View Household →</a>
        <button class="btn-sm" onclick="openHHModal()">Change / Remove</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Household Members (${householdMembers.length})</div>
      <div class="member-list">
        ${householdMembers.map(m => `
          <div class="member-row" onclick="${m.id !== clientId ? `window.location.href='admin-client.html?id=${m.id}'` : ''}">
            <div>
              <div class="member-name">${m.first_name} ${m.last_name}${m.id === clientId ? ' <span style="color:var(--silver-dark);font-size:0.8rem">(you)</span>' : ''}</div>
              <div class="member-meta">${m.email ?? ''}</div>
            </div>
            <span class="role-pill ${roleClass[m.household_role] ?? 'role-athlete'}">${roleLabel[m.household_role] ?? m.household_role}</span>
          </div>`).join('')}
      </div>
    </div>`;
}

async function loadClient() {
  if (!clientId) { window.location.href = 'admin-dashboard.html'; return; }
  const res = await fetch(`${API}/clients/${clientId}`, { headers: authHeaders() });
  if (res.status === 401) { logout(); return; }
  if (!res.ok) { window.location.href = 'admin-dashboard.html'; return; }
  clientData = await res.json();

  document.getElementById('clientName').textContent = `${clientData.first_name} ${clientData.last_name}`;
  document.getElementById('clientSub').textContent = [clientData.email, clientData.phone].filter(Boolean).join(' · ');

  const badges = document.getElementById('headerBadges');
  badges.innerHTML = '';
  if (clientData.household) {
    const hbadge = document.createElement('span');
    hbadge.className = 'badge badge-household';
    hbadge.textContent = clientData.household.name;
    hbadge.onclick = () => window.location.href = `admin-household.html?id=${clientData.household.id}`;
    badges.appendChild(hbadge);
  }
  if (clientData.membership?.status) {
    badges.insertAdjacentHTML('beforeend', badgeHtml(clientData.membership.status));
  }

  fillProfile(clientData);
  renderMembership(clientData.membership ?? null);
  renderLeadBar(clientData);
  document.getElementById('page').style.display = 'block';
  document.getElementById('payDate').value = new Date().toISOString().slice(0, 10);
}

async function loadHouseholds() {
  const res = await fetch(`${API}/households`, { headers: authHeaders() });
  allHouseholds = await res.json();
}

async function saveProfile(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  if (body.years_playing) body.years_playing = parseInt(body.years_playing);
  // preserve household assignment
  body.household_id = clientData.household_id ?? null;
  body.household_role = clientData.household_role ?? null;
  const res = await fetch(`${API}/clients/${clientId}`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify(body) });
  if (!res.ok) { showToast('Error saving profile', 'error'); return; }
  const data = await res.json();
  clientData = { ...clientData, ...data };
  document.getElementById('clientName').textContent = `${data.first_name} ${data.last_name}`;
  document.getElementById('clientSub').textContent = [data.email, data.phone].filter(Boolean).join(' · ');
  showToast('Profile saved');
}

async function loadPayments() {
  const res = await fetch(`${API}/clients/${clientId}/payments`, { headers: authHeaders() });
  const payments = await res.json();
  const tbody = document.getElementById('payTable');
  if (!payments.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty">No payments recorded.</td></tr>'; return; }
  tbody.innerHTML = payments.map(p => `
    <tr>
      <td style="color:var(--silver-light)">${p.date}</td>
      <td style="color:#4caf6e;font-weight:600">$${parseFloat(p.amount).toFixed(2)}</td>
      <td style="text-transform:capitalize">${p.method ?? 'venmo'}</td>
      <td style="color:var(--silver)">${p.venmo_reference ?? '—'}</td>
      <td style="color:var(--silver)">${p.notes ?? '—'}</td>
      <td><button onclick="deletePayment('${p.id}')" style="background:transparent;border:none;color:#ff7b7b;cursor:pointer;font-size:1rem;padding:4px 8px" title="Delete payment">✕</button></td>
    </tr>`).join('');
}

async function addPayment() {
  const amount = parseFloat(document.getElementById('payAmount').value);
  const date = document.getElementById('payDate').value;
  if (!amount || !date) { showToast('Amount and date are required', 'error'); return; }
  const res = await fetch(`${API}/clients/${clientId}/payments`, {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({ amount, date, membership_id: currentMembership?.id ?? null,
      venmo_reference: document.getElementById('payRef').value || null,
      notes: document.getElementById('payNotes').value || null }),
  });
  if (!res.ok) { showToast('Error recording payment', 'error'); return; }
  document.getElementById('payAmount').value = '';
  document.getElementById('payRef').value = '';
  document.getElementById('payNotes').value = '';
  showToast(`$${amount.toFixed(2)} recorded`);
  loadPayments();
  loadClient();
}

const DEFAULT_PRICES = { individual: 395, family_2: 595, family_3plus: 645 };
let editingMembershipId = null;

function updateDefaultPrice() {
  const type = document.getElementById('ren-type').value;
  const priceField = document.getElementById('ren-price');
  if (!priceField.dataset.userEdited) {
    priceField.placeholder = `Default: $${DEFAULT_PRICES[type] ?? '—'}`;
  }
}

function openRenewModal() {
  editingMembershipId = null;
  document.getElementById('renewModalTitle').textContent = 'Add / Renew Membership';
  const today = new Date();
  const nextYear = new Date(today); nextYear.setFullYear(nextYear.getFullYear() + 1);
  document.getElementById('ren-type').value = 'individual';
  document.getElementById('ren-price').value = '';
  document.getElementById('ren-price').dataset.userEdited = '';
  document.getElementById('ren-start').value = today.toISOString().slice(0, 10);
  document.getElementById('ren-renewal').value = nextYear.toISOString().slice(0, 10);
  document.getElementById('ren-paid').value = '0';
  document.getElementById('ren-status').value = 'active';
  document.getElementById('ren-notes').value = '';
  updateDefaultPrice();
  document.getElementById('renewModal').classList.add('open');
}

function openEditMembershipModal(m) {
  editingMembershipId = m.id;
  document.getElementById('renewModalTitle').textContent = 'Edit Membership';
  document.getElementById('ren-type').value = m.type;
  document.getElementById('ren-price').value = m.custom_price != null ? m.custom_price : '';
  document.getElementById('ren-price').dataset.userEdited = m.custom_price != null ? '1' : '';
  document.getElementById('ren-start').value = m.start_date ?? '';
  document.getElementById('ren-renewal').value = m.renewal_date ?? '';
  document.getElementById('ren-paid').value = m.amount_paid ?? 0;
  document.getElementById('ren-status').value = m.status ?? 'active';
  document.getElementById('ren-notes').value = m.notes ?? '';
  updateDefaultPrice();
  document.getElementById('renewModal').classList.add('open');
}

function closeRenewModal() { document.getElementById('renewModal').classList.remove('open'); }

async function saveMembership() {
  const type = document.getElementById('ren-type').value;
  const rawPrice = document.getElementById('ren-price').value;
  const customPrice = rawPrice !== '' ? parseFloat(rawPrice) : null;
  const body = {
    type,
    custom_price: customPrice,
    start_date: document.getElementById('ren-start').value || null,
    renewal_date: document.getElementById('ren-renewal').value || null,
    amount_paid: parseFloat(document.getElementById('ren-paid').value) || 0,
    status: document.getElementById('ren-status').value,
    notes: document.getElementById('ren-notes').value || null,
  };

  let res;
  if (editingMembershipId) {
    res = await fetch(`${API}/memberships/${editingMembershipId}`, {
      method: 'PUT', headers: authHeaders(), body: JSON.stringify(body),
    });
  } else {
    res = await fetch(`${API}/clients/${clientId}/memberships`, {
      method: 'POST', headers: authHeaders(), body: JSON.stringify(body),
    });
  }
  if (!res.ok) { showToast('Error saving membership', 'error'); return; }
  closeRenewModal();
  showToast(editingMembershipId ? 'Membership updated' : 'Membership saved');
  loadClient();
}

function openHHModal() {
  const sel = document.getElementById('hhSelect');
  sel.innerHTML = '<option value="">— None (remove from household) —</option>' +
    allHouseholds.map(h => `<option value="${h.id}" ${h.id === clientData.household_id ? 'selected' : ''}>${h.name}</option>`).join('');
  document.getElementById('hhRole').value = clientData.household_role ?? 'athlete';
  document.getElementById('hhModal').classList.add('open');
}
function closeHHModal() { document.getElementById('hhModal').classList.remove('open'); }

async function saveHousehold() {
  const household_id = document.getElementById('hhSelect').value || null;
  const household_role = household_id ? document.getElementById('hhRole').value : null;
  const form = document.getElementById('profileForm');
  const fd = new FormData(form);
  const body = Object.fromEntries(fd.entries());
  if (body.years_playing) body.years_playing = parseInt(body.years_playing);
  body.household_id = household_id;
  body.household_role = household_role;
  const res = await fetch(`${API}/clients/${clientId}`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify(body) });
  if (!res.ok) { showToast('Error updating household', 'error'); return; }
  closeHHModal(); showToast('Household updated'); await loadClient(); renderHouseholdTab();
}

async function sendInvoice() {
  const btn = document.getElementById('invoiceBtn');
  if (!btn) return;
  btn.disabled = true; btn.textContent = 'Sending…';
  const res = await fetch(`${API}/clients/${clientId}/invoice`, { method: 'POST', headers: authHeaders() });
  if (!res.ok) {
    const d = await res.json();
    showToast(d.error ?? 'Error sending invoice', 'error');
    btn.disabled = false; btn.textContent = 'Send Invoice Email'; return;
  }
  showToast('Invoice sent!');
  btn.textContent = 'Invoice Sent ✓';
  setTimeout(() => { btn.disabled = false; btn.textContent = 'Send Invoice Email'; }, 5000);
}

function renderLeadBar(client) {
  const bar = document.getElementById('leadBar');
  const notesBar = document.getElementById('leadNotesBar');
  if (!client.lead_status) { bar.style.display = 'none'; notesBar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  document.getElementById('leadStatusSelect').value = client.lead_status;
  document.getElementById('leadInquiryType').textContent = client.inquiry_type
    ? `Inquiry: ${client.inquiry_type}` : 'Contact form submission';
  if (client.inquiry_notes) {
    notesBar.style.display = 'block';
    notesBar.textContent = `"${client.inquiry_notes}"`;
  } else {
    notesBar.style.display = 'none';
  }
}

async function updateLeadStatus() {
  const status = document.getElementById('leadStatusSelect').value;
  const form = document.getElementById('profileForm');
  const fd = new FormData(form);
  const body = Object.fromEntries(fd.entries());
  if (body.years_playing) body.years_playing = parseInt(body.years_playing);
  body.household_id = clientData.household_id ?? null;
  body.household_role = clientData.household_role ?? null;
  body.lead_status = status;
  body.inquiry_type = clientData.inquiry_type ?? null;
  body.inquiry_notes = clientData.inquiry_notes ?? null;
  const res = await fetch(`${API}/clients/${clientId}`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify(body) });
  if (!res.ok) { showToast('Error updating status', 'error'); return; }
  clientData.lead_status = status;
  showToast(`Status updated to "${leadStatusLabel(status)}"`);
}

function leadStatusLabel(s) {
  return { lead: 'New Lead', contacted: 'Contacted', converted: 'Converted', closed: 'Closed' }[s] ?? s;
}

async function deleteClient() {
  if (!confirm(`Delete ${clientData.first_name} ${clientData.last_name}? This also removes their memberships and payments and cannot be undone.`)) return;
  const res = await fetch(`${API}/clients/${clientId}`, { method: 'DELETE', headers: authHeaders() });
  if (!res.ok) { showToast('Error deleting client', 'error'); return; }
  window.location.href = 'admin-dashboard.html';
}

async function deleteMembership(membershipId) {
  if (!confirm('Delete this membership record? This cannot be undone.')) return;
  const res = await fetch(`${API}/memberships/${membershipId}`, { method: 'DELETE', headers: authHeaders() });
  if (!res.ok) { showToast('Error deleting membership', 'error'); return; }
  showToast('Membership deleted');
  loadClient();
}

async function deletePayment(paymentId) {
  if (!confirm('Delete this payment? The balance will be reversed on the membership.')) return;
  const res = await fetch(`${API}/payments/${paymentId}`, { method: 'DELETE', headers: authHeaders() });
  if (!res.ok) { showToast('Error deleting payment', 'error'); return; }
  showToast('Payment deleted');
  loadPayments();
  loadClient();
}

document.getElementById('renewModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeRenewModal(); });
document.getElementById('hhModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeHHModal(); });

getToken();
Promise.all([loadClient(), loadHouseholds()]);
</script>
</body>
