<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Nitro Sports Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:#2B4FA8; --blue-dark:#1a3278; --blue-light:#3d65cc;
    --gold:#E8B84B; --silver:#9AA0B4; --silver-light:#C8CDD9;
    --dark:#0D1321; --dark-mid:#1C2540; --white:#fff;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--dark-mid);border:1px solid rgba(43,79,168,0.4);border-radius:10px;padding:48px 40px;width:100%;max-width:420px}
  .logo{text-align:center;margin-bottom:32px}
  .logo img{height:64px}
  h1{font-family:'Oswald',sans-serif;font-size:1.5rem;letter-spacing:0.08em;text-transform:uppercase;text-align:center;margin-bottom:4px}
  .sub{text-align:center;color:var(--silver);font-size:0.9rem;margin-bottom:32px}
  label{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--silver);margin-bottom:6px}
  input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:12px 16px;color:var(--white);font-family:'Barlow',sans-serif;font-size:1rem;outline:none;transition:border-color 0.2s;margin-bottom:20px}
  input:focus{border-color:var(--blue-light)}
  button{width:100%;background:var(--blue);border:none;border-radius:6px;padding:14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--white);cursor:pointer;transition:background 0.2s}
  button:hover{background:var(--blue-light)}
  button:disabled{opacity:0.6;cursor:not-allowed}
  .error{background:rgba(220,50,50,0.15);border:1px solid rgba(220,50,50,0.4);border-radius:6px;padding:12px 16px;color:#ff7b7b;font-size:0.9rem;margin-bottom:20px;display:none}
</style>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <meta name="theme-color" content="#3d65cc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nitro Admin" />
</head>
<body>
<div class="card">
  <div class="logo">
    <div style="font-family:'Oswald',sans-serif;font-size:1.4rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;">
      <span style="color:#3d65cc;">NITRO</span> SPORTS ACADEMY
    </div>
  </div>
  <h1>Admin Portal</h1>
  <p class="sub">Nitro Sports Academy</p>
  <div class="error" id="error"></div>
  <form id="loginForm">
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" id="btn">Sign In</button>
  </form>
</div>
<script>
const API = 'https://nitro-crm.nicholas-vastano.workers.dev';

if (localStorage.getItem('nitro_token')) {
  window.location.href = 'admin-dashboard.html';
}

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const errEl = document.getElementById('error');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    localStorage.setItem('nitro_token', data.token);
    window.location.href = 'admin-dashboard.html';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
